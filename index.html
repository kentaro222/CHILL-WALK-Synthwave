<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHILL WALK - Synthwave</title>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#020010">
    <link rel="apple-touch-icon" href="./icon-192.png">
    <style>
        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            width: 100%;
            min-height: 100%;
            background: #020010;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            color: #fff;
            font-family: 'Courier New', monospace;
            overflow: hidden;
        }

        #game-wrapper {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            border: 1px solid #1a1a1a;
            box-shadow: 0 0 40px rgba(255, 0, 255, 0.1);
        }

        #clock-display {
            position: absolute;
            top: 25%;
            right: 10%;
            font-size: clamp(40px, 8vw, 80px);
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 15px #ff00ff, 0 0 30px #00ffff;
            pointer-events: none;
            letter-spacing: 4px;
            z-index: 100;
            text-align: right;
        }

        #wakelock-container {
            position: absolute;
            bottom: max(20px, env(safe-area-inset-bottom));
            right: max(20px, env(safe-area-inset-right));
            width: 44px;
            height: 44px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.7);
            border: 0;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255, 0, 255, 0.3);
            transition: box-shadow 0.3s, background 0.3s, opacity 0.3s;
            z-index: 200;
            -webkit-tap-highlight-color: transparent;
        }

        #wakelock-container:hover,
        #wakelock-container:focus-visible {
            box-shadow: 0 0 20px rgba(255, 0, 255, 0.6);
            background: rgba(255, 0, 255, 0.1);
            outline: 2px solid rgba(255, 255, 255, 0.8);
            outline-offset: 2px;
        }

        #wakelock-container:disabled {
            cursor: default;
            opacity: 0.3;
        }

        #wakelock-status-light {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #ff3333;
            box-shadow: 0 0 8px #ff3333;
        }

        #wakelock-container.active #wakelock-status-light {
            background-color: #33ff33;
            box-shadow: 0 0 10px #33ff33;
        }

        @media (prefers-reduced-motion: reduce) {
            #wakelock-container {
                transition: none;
            }
        }
    </style>
</head>
<body>
    <div id="game-wrapper">
        <div id="clock-display" aria-live="off">00:00:00</div>
        <button
            id="wakelock-container"
            type="button"
            aria-label="画面の自動消灯を防止"
            aria-pressed="false"
            title="画面の自動消灯を防止"
        >
            <span id="wakelock-status-light" aria-hidden="true"></span>
        </button>
        <canvas id="gameCanvas" width="640" height="360" aria-label="Synthwave walking scene"></canvas>
    </div>

<script>
    // --- Service Worker 登録 (PWA) ---
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js')
                .then(reg => console.log('SW registered!', reg))
                .catch(err => console.error('SW registration failed', err));
        });
    }

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const clockDisplay = document.getElementById('clock-display');
    const wlContainer = document.getElementById('wakelock-container');

    const INTERNAL_W = 640;
    const INTERNAL_H = 360;
    const GROUND_Y = 280;
    const PLAYER_SIZE = 48;
    const TARGET_FPS = 60;
    const FRAME_INTERVAL = 1000 / TARGET_FPS;

    const stars = Array.from({ length: 30 }, () => ({
        x: Math.random() * INTERNAL_W,
        y: Math.random() * GROUND_Y,
        size: 1,
        speed: Math.random() * 6 + 3 // px / sec
    }));

    const SUN_SIZE = 180;
    const SUN_Y = GROUND_Y - 30;

    let hueOffset = 280;
    let scrollX = 0;
    let lastRenderTime = performance.now();
    let animationTime = 0;
    let lastClockSecond = -1;

    const spriteSheet = new Image();
    spriteSheet.src = './player_1bit00_sheet.png';
    let imageLoaded = false;
    spriteSheet.onload = () => { imageLoaded = true; };
    spriteSheet.onerror = (err) => console.error('Sprite load failed', err);

    // --- Wake Lock ---
    let wakeLock = null;
    let wakeLockWanted = false;

    function updateWLUI(active) {
        wlContainer.classList.toggle('active', active);
        wlContainer.setAttribute('aria-pressed', String(wakeLockWanted));
        wlContainer.title = wakeLockWanted
            ? (active ? '画面の自動消灯防止: ON' : '画面の自動消灯防止: 再取得待ち')
            : '画面の自動消灯防止: OFF';
    }

    async function acquireWakeLock() {
        if (!wakeLockWanted || wakeLock || document.visibilityState !== 'visible') return;

        try {
            wakeLock = await navigator.wakeLock.request('screen');
            updateWLUI(true);

            wakeLock.addEventListener('release', () => {
                wakeLock = null;
                updateWLUI(false);
            });
        } catch (err) {
            wakeLock = null;
            updateWLUI(false);
            console.error('Wake Lock request failed', err);
        }
    }

    if ('wakeLock' in navigator) {
        wlContainer.addEventListener('click', async () => {
            wakeLockWanted = !wakeLockWanted;

            if (wakeLockWanted) {
                await acquireWakeLock();
            } else {
                const currentLock = wakeLock;
                wakeLock = null;
                updateWLUI(false);
                if (currentLock) {
                    try {
                        await currentLock.release();
                    } catch (err) {
                        console.error('Wake Lock release failed', err);
                    }
                }
            }
        });

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible' && wakeLockWanted) {
                acquireWakeLock();
            }
        });
    } else {
        wlContainer.disabled = true;
        wlContainer.setAttribute('aria-label', 'このブラウザは画面の自動消灯防止に対応していません');
        wlContainer.title = 'Wake Lock API 非対応';
    }

    function resize() {
        const rawScale = Math.min(
            window.innerWidth / INTERNAL_W,
            window.innerHeight / INTERNAL_H
        );

        // 1倍以上では整数倍率を優先。小画面では収まるよう縮小する。
        const scale = rawScale >= 1 ? Math.max(1, Math.floor(rawScale)) : rawScale;

        canvas.width = INTERNAL_W;
        canvas.height = INTERNAL_H;
        canvas.style.width = `${INTERNAL_W * scale}px`;
        canvas.style.height = `${INTERNAL_H * scale}px`;
        ctx.imageSmoothingEnabled = false;
    }

    window.addEventListener('resize', resize);
    resize();

    function updateClock(now) {
        const second = now.getSeconds();
        if (second === lastClockSecond) return;

        lastClockSecond = second;
        clockDisplay.textContent = now.toTimeString().slice(0, 8);
    }

    function drawSky(lightnessBase) {
        const darkL = 15;
        const brightL = 70;
        const l = darkL + (brightL - darkL) * lightnessBase;
        const s = 70 + 25 * lightnessBase;

        const skyGrad = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
        skyGrad.addColorStop(0, `hsl(${(hueOffset + 180) % 360}, ${s}%, ${l * 0.8}%)`);
        skyGrad.addColorStop(1, `hsl(${(hueOffset + 30) % 360}, ${s}%, ${l}%)`);
        ctx.fillStyle = skyGrad;
        ctx.fillRect(0, 0, INTERNAL_W, GROUND_Y);

        return skyGrad;
    }

    function drawStars(dt, lightnessBase) {
        ctx.save();
        ctx.fillStyle = '#fff';
        ctx.globalAlpha = 1 - lightnessBase * 0.8;

        stars.forEach(star => {
            star.x -= star.speed * dt;
            if (star.x < -star.size) {
                star.x = INTERNAL_W;
                star.y = Math.random() * GROUND_Y;
            }
            ctx.fillRect(Math.floor(star.x), Math.floor(star.y), star.size, star.size);
        });

        ctx.restore();
    }

    function drawSun(skyGrad) {
        const sunGrad = ctx.createLinearGradient(
            0,
            SUN_Y - SUN_SIZE / 2,
            0,
            SUN_Y + SUN_SIZE / 2
        );
        sunGrad.addColorStop(0, `hsl(${(hueOffset + 60) % 360}, 100%, 80%)`);
        sunGrad.addColorStop(1, `hsl(${(hueOffset + 10) % 360}, 100%, 50%)`);

        ctx.save();
        ctx.fillStyle = sunGrad;
        ctx.shadowColor = `hsl(${(hueOffset + 30) % 360}, 100%, 70%)`;
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.arc(INTERNAL_W / 2, SUN_Y, SUN_SIZE / 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // 太陽の円内だけを空色で削り、Synthwave風の横縞を作る。
        ctx.save();
        ctx.beginPath();
        ctx.arc(INTERNAL_W / 2, SUN_Y, SUN_SIZE / 2, 0, Math.PI * 2);
        ctx.clip();
        ctx.fillStyle = skyGrad;

        const borderCount = 4;
        const borderSpacing = 15;
        const firstBorderY = GROUND_Y - 8;

        for (let i = 0; i < borderCount; i++) {
            const borderY = firstBorderY - i * borderSpacing;
            const borderHeight = 7 - i; // 下側ほど太い
            ctx.fillRect(
                INTERNAL_W / 2 - SUN_SIZE / 2,
                borderY,
                SUN_SIZE,
                borderHeight
            );
        }
        ctx.restore();
    }

    function drawMountains() {
        ctx.fillStyle = `hsl(${(hueOffset + 20) % 360}, 50%, 8%)`;

        const mountainWidth = 300;
        const mountainCount = 6;
        const loopWidth = mountainWidth * mountainCount;

        for (let i = 0; i < mountainCount; i++) {
            const baseX = i * mountainWidth - 150;
            const mx = ((baseX - scrollX * 0.3 + 150) % loopWidth + loopWidth) % loopWidth - 150;

            // 現在位置と1周期前も描いて継ぎ目を隠す。
            for (const x of [mx, mx - loopWidth]) {
                ctx.beginPath();
                ctx.moveTo(x, GROUND_Y);
                ctx.lineTo(x + mountainWidth / 2, GROUND_Y - 70);
                ctx.lineTo(x + mountainWidth, GROUND_Y);
                ctx.fill();
            }
        }
    }

    function drawGroundAndGrid() {
        ctx.fillStyle = '#000';
        ctx.fillRect(0, GROUND_Y, INTERNAL_W, INTERNAL_H - GROUND_Y);

        ctx.strokeStyle = `hsl(${hueOffset}, 100%, 50%)`;
        ctx.lineWidth = 1;

        for (let i = 1; i <= 10; i++) {
            const y = GROUND_Y + Math.pow(i / 10, 2) * (INTERNAL_H - GROUND_Y);
            ctx.globalAlpha = i / 10;
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(INTERNAL_W, y);
            ctx.stroke();
        }

        const gridSpeed = (scrollX * 2.5) % 60;
        for (let x = -100; x < INTERNAL_W + 100; x += 60) {
            const curX = x - gridSpeed;
            ctx.globalAlpha = 0.2;
            ctx.beginPath();
            ctx.moveTo(INTERNAL_W / 2 + (curX - INTERNAL_W / 2) * 0.2, GROUND_Y);
            ctx.lineTo(curX, INTERNAL_H);
            ctx.stroke();
        }

        ctx.globalAlpha = 1;
    }

    function drawPlayer() {
    if (!imageLoaded) return;

    // ゆったりした歩行アニメーション
    const sx = Math.floor(animationTime / 0.24) % 2 ? 16 : 0;

    // animationTime は秒単位
    // 左右にゆっくり蛇行
    const zigzagX = Math.sin(animationTime * 0.38) * 45;

    // 前後方向のゆったりした動き
    const depthWave = Math.sin(animationTime * 0.24);

    // 基準位置
    const baseX = 100;
    const playerGroundOverlap = 15;
    const baseY = GROUND_Y - PLAYER_SIZE + playerGroundOverlap;

    // 奥へ行くと上、手前へ来ると下
    const depthY = depthWave * 12;

    const playerX = baseX + zigzagX;
    const playerY = baseY + depthY;

    // 奥では少し小さく、手前では少し大きく
    // 約 90% ～ 105%
    const depth = (depthWave + 1) / 2;
    const playerScale = 0.90 + depth * 0.15;

    const drawSize = PLAYER_SIZE * playerScale;

    ctx.save();

    ctx.translate(
        Math.floor(playerX + drawSize),
        Math.floor(playerY + (PLAYER_SIZE - drawSize))
    );

    ctx.scale(-1, 1);

    ctx.drawImage(
        spriteSheet,
        sx, 0, 16, 16,
        0, 0,
        Math.floor(drawSize),
        Math.floor(drawSize)
    );

    ctx.restore();
}

    function draw(time) {
        requestAnimationFrame(draw);

        const elapsed = time - lastRenderTime;
        if (elapsed < FRAME_INTERVAL) return;

        const dt = Math.min(elapsed / 1000, 0.05);
        lastRenderTime = time - (elapsed % FRAME_INTERVAL);
        animationTime += dt;

        scrollX += 72 * dt;
        hueOffset = (hueOffset + 3 * dt) % 360;

        updateClock(new Date());
        ctx.clearRect(0, 0, INTERNAL_W, INTERNAL_H);

        // 10分で1周期。急激に色が変わらないようゆっくり遷移する。
        const cycleTime = Date.now() / 600000;
        const lightnessBase = (Math.sin(cycleTime * Math.PI * 2) + 1) / 2;

        const skyGrad = drawSky(lightnessBase);
        drawStars(dt, lightnessBase);
        drawSun(skyGrad);
        drawMountains();
        drawGroundAndGrid();
        drawPlayer();
    }

    requestAnimationFrame(draw);
</script>
</body>
</html>
